# Move to .github/workflows/reviewer.yml in week 5. Requires Actions secret ANTHROPIC_API_KEY and repo variable REVIEWER_MODEL.
name: reviewer
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, edited]
jobs:
  review:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_fix_links: false
          prompt: |
            Read .github/reviewer/REVIEWER.md and follow it exactly.
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
          # Tool names NEEDS VERIFICATION against the action's docs
          claude_args: >-
            --model ${{ vars.REVIEWER_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
  review-gate:
    needs: [review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - run: python tools/review_gate.py --pr ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
