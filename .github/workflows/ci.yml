name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-types-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=src --cov-report=xml --cov-fail-under=${{ vars.COV_MIN || 0 }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
  settings-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/settings_guard.py
